<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S3FAI - AI Fashion</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">S3FAI</div>

<nav>
<a href="#home">Home</a>
<a href="#men">Men</a>
<a href="#women">Women</a>
<a href="#shoes">Shoes</a>
<a href="#stylist">AI Stylist</a>
</nav>

</header>

<section class="hero">

<div class="hero-text">
<h1>Find Your Perfect Outfit With AI</h1>

<p>
Upload your photo and get outfit recommendations based on your style,
budget and occasion.
</p>

<a href="#stylist" class="btn">Start Styling</a>
</div>

<div class="hero-image">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=700" alt="">
</div>

</section>

<section id="stylist">

<h2>AI Stylist</h2>

<form>

<input type="file">

<select>
<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<select>
<option>Select Occasion</option>
<option>Date</option>
<option>Office</option>
<option>Wedding</option>
<option>Party</option>
</select>

<select>
<option>Select Budget</option>
<option>₹1000</option>
<option>₹3000</option>
<option>₹5000+</option>
</select>

<button>Find My Outfit</button>

</form>

</section>

<section class="products">

<h2>Featured Products</h2>

<div class="cards">

</div>

</section>

<footer>
<p>© 2026 S3FAI - AI Fashion Platform</p>
</footer>

<script src="script.js"></script>    
</body>
</html>
