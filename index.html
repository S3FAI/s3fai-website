<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S3FAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#111;color:#fff;}
header{display:flex;justify-content:space-between;align-items:center;padding:20px;background:#000;position:sticky;top:0;}
.logo{font-size:28px;font-weight:bold;color:#00bfff;}
nav a{color:#fff;text-decoration:none;margin:0 15px;}
nav a:hover{color:#00bfff;}
section{padding:80px 20px;text-align:center;min-height:100vh;}
.hero{display:flex;flex-direction:column;justify-content:center;align-items:center;}
.hero h1{font-size:42px;margin-bottom:20px;}
.hero p{max-width:600px;margin-bottom:20px;}
.btn{display:inline-block;padding:12px 25px;background:#00bfff;color:#fff;text-decoration:none;border-radius:8px;}
.card{background:#222;padding:20px;border-radius:10px;margin:20px auto;max-width:350px;}
</style>

</head>
<body>

<header>
<div class="logo">S3FAI</div>

<nav>
<a href="#home">Home</a>
<a href="#men">Men</a>
<a href="#women">Women</a>
<a href="#shoes">Shoes</a>
<a href="#stylist">AI Stylist</a>
</nav>
</header>

<section id="home" class="hero">
<h1>Find Your Perfect Outfit With AI</h1>
<p>Premium Fashion for Every Occasion.</p>
<a href="#stylist" class="btn">Start Styling</a>
</section>

<section id="men">
<h2>Men Collection</h2>
<div class="card">Premium Men's Fashion</div>
</section>

<section id="women">
<h2>Women Collection</h2>
<div class="card">Premium Women's Fashion</div>
</section>

<section id="shoes">
<h2>Shoes Collection</h2>
<div class="card">Trending Shoes</div>
</section>

<section id="stylist">
<h2>AI Stylist</h2>
<p>Coming Soon...</p>
</section>

</body>
</html>
